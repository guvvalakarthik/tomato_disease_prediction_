name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile Python modules
        run: python -m compileall -q api training/tomato_guard_ml tests
      - name: Test API with coverage
        run: pytest --cov=api --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build frontend container
        run: docker build -f frontend/Dockerfile -t tomatoguard-frontend .
      - name: Build legacy API container
        run: docker build -f api/Dockerfile -t tomatoguard-api .

  model-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect validated model candidate
        id: release
        shell: bash
        run: |
          if [[ -f model/release/model.onnx ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.release.outputs.present == 'true'
        with:
          python-version: "3.12"
      - if: steps.release.outputs.present == 'true'
        run: python -m pip install onnxruntime==1.22.1 numpy==2.1.3
      - name: Validate ONNX release contract
        if: steps.release.outputs.present == 'true'
        run: python scripts/validate_release.py model/release
      - name: Build lightweight API container
        if: steps.release.outputs.present == 'true'
        run: docker build -f api/Dockerfile.onnx -t tomatoguard-api-onnx .

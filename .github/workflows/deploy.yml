name: Deploy validated release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag containing tomatoguard-model.zip
        required: true
        type: string
      model_version:
        description: Semantic model version expected from readiness
        required: true
        type: string
      api_url:
        description: Public API origin, without trailing slash
        required: true
        type: string
      frontend_url:
        description: Public frontend origin, without trailing slash
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ inputs.frontend_url }}
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/tomatoguard-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Download immutable model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/release
          gh release download "${{ inputs.release_tag }}" \
            --pattern tomatoguard-model.zip \
            --dir /tmp/tomatoguard-release
          unzip -q /tmp/tomatoguard-release/tomatoguard-model.zip -d model/release

      - name: Validate model evidence before deployment
        run: |
          python -m pip install onnxruntime==1.22.1 numpy==2.1.3
          python scripts/validate_release.py model/release

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile.onnx
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ inputs.model_version }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.model_version }}
          cache-from: type=gha,scope=tomatoguard-api
          cache-to: type=gha,mode=max,scope=tomatoguard-api

      - name: Trigger image-backed Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --get "$RENDER_DEPLOY_HOOK_URL" \
            --data-urlencode "imgURL=${API_IMAGE}:${{ inputs.model_version }}"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend against production API
        working-directory: frontend
        env:
          VITE_API_URL: ${{ inputs.api_url }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Deploy frontend to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@4.115.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-hash "${{ github.sha }}"

      - name: Verify public deployment
        run: |
          python scripts/smoke_deployment.py \
            --api-url "${{ inputs.api_url }}" \
            --frontend-url "${{ inputs.frontend_url }}" \
            --expected-model-version "${{ inputs.model_version }}" \
            --attempts 60 \
            --interval-seconds 10

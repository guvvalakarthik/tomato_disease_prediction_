services:
  - type: web
    name: tomatoguard-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: TOMATOGUARD_ALLOWED_ORIGINS
        sync: false
      - key: TOMATOGUARD_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: TOMATOGUARD_MAX_IMAGE_PIXELS
        value: "25000000"
      - key: TOMATOGUARD_LOG_LEVEL
        value: INFO

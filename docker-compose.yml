services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: "8000"
      TOMATOGUARD_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:8080"
    restart: unless-stopped

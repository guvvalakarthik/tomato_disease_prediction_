[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tomatoguard-api"
version = "1.0.0"
description = "Field-aware tomato leaf disease inference API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.1.3",
  "onnxruntime==1.22.1",
  "pillow==11.3.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
legacy = ["tensorflow==2.20.0"]
test = [
  "h5py==3.16.0",
  "httpx==0.28.1",
  "onnx==1.17.0",
  "pandas==2.3.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "scikit-learn==1.7.1",
  "scipy==1.16.0",
]
ml = [
  "h5py==3.16.0",
  "matplotlib==3.10.3",
  "onnx==1.17.0",
  "pandas==2.3.1",
  "scikit-learn==1.7.1",
  "scipy==1.16.0",
  "seaborn==0.13.2",
  "tensorflow==2.20.0",
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.vercel]
entrypoint = "api.main:app"

[tool.coverage.run]
source = ["api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
